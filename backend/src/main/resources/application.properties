spring.datasource.url="YOUR_DB_URL"
spring.datasource.username="YOUR_DB_USERNAME"
spring.datasource.password="YOUR_DB_PASSWORD"
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret="YOUR_JWT_SECRET"
app.jwt.expiration-ms=86400000

app.upload.base-dir=${UPLOAD_DIR:./uploads}
app.upload.case-documents=${app.upload.base-dir}/case_documents
app.upload.chat-files=${app.upload.base-dir}/chat_files

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
app.gemini.endpoint=${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}

server.port=8080
server.servlet.context-path=/

logging.level.com.legalconnect=INFO
logging.level.org.springframework.security=WARN